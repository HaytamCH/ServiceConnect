x-backend-environment: &backend-environment
  APP_NAME: ServiceConnect
  APP_ENV: production
  APP_KEY: ${APP_KEY:?APP_KEY must be configured in Portainer}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?APP_URL must be configured in Portainer}
  FRONTEND_URL: ${APP_URL:?APP_URL must be configured in Portainer}
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: database
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-serviceconnect}
  DB_USERNAME: ${DB_USERNAME:-serviceconnect}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured in Portainer}
  CACHE_STORE: file
  FILESYSTEM_DISK: public
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: file
  MAIL_MAILER: log
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@serviceconnect.local}
  MAIL_FROM_NAME: ServiceConnect
  STRIPE_KEY: ${STRIPE_KEY:-}
  STRIPE_SECRET: ${STRIPE_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

services:
  database:
    image: ghcr.io/haytamch/serviceconnect-database:${IMAGE_TAG:?IMAGE_TAG must be configured in Portainer}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-serviceconnect}
      MARIADB_USER: ${DB_USERNAME:-serviceconnect}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured in Portainer}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be configured in Portainer}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 1m

  backend-init:
    image: ghcr.io/haytamch/serviceconnect-backend:${IMAGE_TAG:?IMAGE_TAG must be configured in Portainer}
    restart: "no"
    environment: *backend-environment
    command: ["/usr/local/bin/initialize-serviceconnect"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - database

  backend:
    image: ghcr.io/haytamch/serviceconnect-backend:${IMAGE_TAG:?IMAGE_TAG must be configured in Portainer}
    restart: unless-stopped
    environment: *backend-environment
    volumes:
      - public_uploads:/var/www/html/storage/app/public
    depends_on:
      database:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8200}:80"
    networks:
      - application
      - database
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/haytamch/serviceconnect-frontend:${IMAGE_TAG:?IMAGE_TAG must be configured in Portainer}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8201}:80"
    networks:
      - application
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  database_data:
    external: true
    name: serviceconnect_mariadb_prod_data_v1
  public_uploads:
    external: true
    name: serviceconnect_public_uploads_prod_v1

networks:
  application:
  database:
    internal: true
