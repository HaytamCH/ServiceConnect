name: Build ServiceConnect

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/haytamch/serviceconnect-backend
  FRONTEND_IMAGE: ghcr.io/haytamch/serviceconnect-frontend
  VITE_API_BASE_URL: /api/v1

jobs:
  verify-application:
    name: Verify application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip, mbstring
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install Laravel dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Check Laravel routes
        run: php artisan route:list

      - name: Run Laravel tests
        run: php artisan test

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vue.js dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vue.js frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        run: npm run build

      - name: Validate Docker Compose configuration
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: http://localhost:8201
          DB_PASSWORD: ci-password
          DB_ROOT_PASSWORD: ci-root-password
        run: docker compose --file docker-compose.production.yml config --quiet

  docker-build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: verify-application

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Laravel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Vue.js image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
